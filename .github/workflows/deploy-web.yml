name: Pubblica sito web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Prepara GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara i file del sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
